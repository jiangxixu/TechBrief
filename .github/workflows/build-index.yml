name: Build TechBrief index

on:
  push:
    branches:
      - main
    paths:
      - 'data/daily/**.json'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build index
        run: node scripts/build-index.mjs

      - name: Commit index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/index.json
          git commit -m "Update TechBrief daily index" || echo "No index changes"
          git push
