name: Daily TechBrief Refresh

# 说明：
# GitHub Actions 可以每天自动运行维护任务。
# 由于日报正文由 ChatGPT 生成（不使用额外模型 API），
# 本流程负责检查已有日报、更新索引、触发部署。

on:
  schedule:
    # 北京时间 08:10（UTC+8），GitHub cron 使用 UTC
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build daily index
        run: |
          if [ -f scripts/build-index.mjs ]; then
            node scripts/build-index.mjs
          fi

      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/index.json
          git diff --cached --quiet || git commit -m "chore: refresh TechBrief daily index"
          git push
