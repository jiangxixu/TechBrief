name: Generate Daily AI News

on:
  schedule:
    # GitHub cron 使用 UTC；00:00 UTC = 北京时间 08:00。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: '覆盖当天已经存在的日报'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-5.6-sol' }}
      FORCE_REGENERATE: ${{ inputs.force_regenerate || 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check configuration
        run: |
          test -n "$OPENAI_API_KEY" || { echo "Missing secret: OPENAI_API_KEY"; exit 1; }
          test -n "$OPENAI_BASE_URL" || { echo "Missing secret: OPENAI_BASE_URL"; exit 1; }
          test -n "$OPENAI_MODEL" || { echo "Missing model configuration"; exit 1; }

      - name: Generate daily edition
        run: npm run generate:daily

      - name: Validate and build
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/ data/catalog.json
          if git diff --cached --quiet; then
            echo "No new edition to commit."
            exit 0
          fi
          git commit -m "content: publish daily TechBrief"
          git pull --rebase origin main
          git push origin HEAD:main
